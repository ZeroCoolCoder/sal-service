spring:
  application:
    name: sal-service

  datasource:
    url: jdbc:postgresql://localhost:5433/sal_db
    username: ${DB_USERNAME:sal_user}
    password: ${DB_PASSWORD:sal_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8081

# SAL Configuration
sal:
  # Default storage provider
  default-storage-type: FILESYSTEM
  
  # File system storage configuration
  filesystem:
    base-path: ${SAL_STORAGE_PATH:./storage}
    create-directories: true
  
  # Database storage configuration  
  database:
    enabled: true
  
  # Compression settings
  compression:
    enabled: true
    default-type: GZIP
    min-size-bytes: 1024  # Only compress files > 1KB
  
  # Checksum settings
  checksum:
    algorithm: SHA-256
    verify-on-download: true
  
  # Version settings
  versioning:
    max-versions-per-object: 100
    auto-cleanup-old-versions: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: sal-service

logging:
  level:
    com.sal: DEBUG
    org.springframework.jdbc: DEBUG
